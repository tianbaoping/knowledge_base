# ============================================================
# Knowledge Base System - Logrotate 配置
# ============================================================
# 安装方法:
#   sudo cp knowledge-base-logrotate.conf /etc/logrotate.d/knowledge-base
#
# 说明: 自动轮转应用日志，防止日志文件无限增长
# ============================================================

# 应用日志目录
__INSTALL_DIR__/data/logs/*.log {
    # 按大小轮转 (也可改为 weekly 按时间轮转)
    size 100M
    # 保留的旧日志文件数量
    rotate 10
    # 压缩旧日志
    compress
    # 不压缩最近的日志
    delaycompress
    # 轮转时创建新日志文件
    create 0644 __USER__ __GROUP__
    # 如果文件不存在，不报错
    missingok
    # 空文件不轮转
    notifempty
    # 轮转后不截断原文件 (loguru 会自动创建新文件)
    copytruncate
    # 轮转后发送信号给应用 (可选, 若应用支持)
    # postrotate
    #     /bin/killall -HUP knowledge-base 2>/dev/null || true
    # endscript
}

# OCR 服务日志
__INSTALL_DIR__/ocr_service/data/logs/*.log {
    size 50M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
